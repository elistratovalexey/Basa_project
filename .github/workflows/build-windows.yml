name: Build Windows EXE
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt pyinstaller

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # нужно для git rev-list --count HEAD
      - name: Check build files exist
        shell: bash
        run: |
          for f in app.py requirements.txt basa.spec preflight_check.py; do
            if [ ! -f "$f" ]; then echo "MISSING FILE: $f"; exit 1; fi
            echo "OK: $f"
          done

      - name: Preflight
        run: python preflight_check.py
        
      - name: Compute version
        id: ver
        shell: bash
        run: |
          python version.py --write
          cat version.json
          V=$(python -c "import version; print(version.VERSION)")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Собираем версию $V"

      - name: Build
        run: pyinstaller --noconfirm --clean basa.spec

      - uses: actions/upload-artifact@v4
        with:
          name: BasaProject-windows-${{ steps.ver.outputs.version }}-run${{ github.run_number }}
          path: dist/BasaProject
          retention-days: 30