name: Build Windows EXE

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'logs/**'
      - 'backups/**'
      - '*.md'
      - 'project_log.txt'
      - 'translation_cache.json'
      - 'window_geometry.json'
      - 'app/**'
      - 'gradle/**'
      - '*.kts'
      - 'gradle.properties'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      # ОДИН checkout, сразу с полной историей (нужно для git rev-list --count)
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.12 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Show environment
        shell: pwsh
        run: |
          python -V
          python -c "import sys, locale; print('stdout:', sys.stdout.encoding, '| preferred:', locale.getpreferredencoding())"
          git rev-list --count HEAD

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Check build files exist
        shell: bash
        run: |
          miss=0
          for f in app.py config.py database.py utils.py settings_dialog.py \
                   requirements.txt basa.spec preflight_check.py; do
            if [ ! -f "$f" ]; then echo "::error file=$f::MISSING FILE: $f"; miss=1; else echo "OK: $f"; fi
          done
          for d in tabs dialogs; do
            if [ ! -d "$d" ]; then echo "::error::MISSING DIR: $d"; miss=1; else echo "OK: $d/"; fi
          done
          exit $miss

      - name: Report optional modules
        shell: bash
        run: |
          for f in paths.py terminal_log.py version.py VERSION reminders.py cloud_sync.py installer.iss app.ico; do
            if [ -f "$f" ]; then echo "present : $f"; else echo "absent  : $f"; fi
          done

      - name: Preflight
        run: python preflight_check.py

      - name: Compile all sources
        shell: bash
        run: |
          python - <<'EOF'
          import pathlib, py_compile, sys
          skip = {"venv", "venv_win", ".git", "build", "dist", "__pycache__", "logs", "backups", "app"}
          bad, n = [], 0
          for p in pathlib.Path(".").rglob("*.py"):
              if any(part in skip for part in p.parts):
                  continue
              n += 1
              try:
                  py_compile.compile(str(p), doraise=True)
              except Exception as e:
                  bad.append(f"{p}: {e}")
          print(f"compiled {n} files, errors: {len(bad)}")
          for b in bad:
              print("ERROR", b)
          sys.exit(1 if bad else 0)
          EOF

      # Главный gate: импорт app ловит отсутствующие модули ДО сборки exe
      - name: Import smoke test
        shell: bash
        run: |
          python - <<'EOF'
          import importlib, os, sys
          required = ["config", "utils", "database", "settings_dialog", "tabs", "dialogs", "app"]
          optional = ["paths", "terminal_log", "version", "reminders", "cloud_sync"]
          failed = []
          for m in required:
              try:
                  importlib.import_module(m)
                  print(f"OK   import {m}")
              except ModuleNotFoundError as e:
                  print(f"::error::FAIL import {m}: {e}")
                  failed.append(m)
              except Exception as e:
                  print(f"WARN import {m}: {type(e).__name__}: {e}")
          for m in optional:
              if not os.path.isfile(m + ".py"):
                  print(f"skip {m} (файла нет)")
                  continue
              try:
                  importlib.import_module(m)
                  print(f"OK   import {m}")
              except Exception as e:
                  print(f"WARN import {m}: {type(e).__name__}: {e}")
          if failed:
              sys.exit(1)
          print("IMPORT SMOKE TEST OK")
          EOF

      # ОДИН шаг версии, с fallback пока version.py не добавлен
      - name: Compute version
        id: ver
        shell: bash
        run: |
          if [ -f version.py ]; then
            python version.py --write
            cat version.json
            V=$(python -c "import version; print(version.VERSION)")
          else
            echo "version.py отсутствует — беру версию из config.py"
            V=$(python -c "import config; print(config.VERSION)" 2>/dev/null || echo "0.0.0")
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Собираем версию $V"

      - name: Build EXE (PyInstaller)
        run: pyinstaller --noconfirm --clean basa.spec

      - name: Verify build output
        shell: pwsh
        run: |
          $exe = "dist\BasaProject\BasaProject.exe"
          if (-not (Test-Path $exe)) {
            Write-Host "::error::Не найден $exe"
            Get-ChildItem -Recurse dist -ErrorAction SilentlyContinue | Select-Object -First 40
            exit 1
          }
          $size = (Get-ChildItem -Recurse dist\BasaProject | Measure-Object -Property Length -Sum).Sum / 1MB
          Write-Host ("Готово: {0} ({1:N1} МБ)" -f $exe, $size)
      - name: Publish update to Mail.ru cloud
        if: github.event_name == 'workflow_dispatch'
        env:
          MAILRU_USER: ${{ secrets.MAILRU_USER }}
          MAILRU_APP_PASSWORD: ${{ secrets.MAILRU_APP_PASSWORD }}
          MAILRU_REMOTE_DIR: BasaProject
        shell: bash
        run: |
          if [ -z "$MAILRU_USER" ] || [ -z "$MAILRU_APP_PASSWORD" ]; then
            echo "::error::Не заданы секреты MAILRU_USER / MAILRU_APP_PASSWORD"
            exit 1
          fi
          python publish_update.py --info
          python publish_update.py --win dist/BasaProject \
            --notes "Сборка run${{ github.run_number }} от $(date +%d.%m.%Y)"

      - name: Build installer (Inno Setup)
        if: hashFiles('installer.iss') != ''
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe" }
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload portable app
        uses: actions/upload-artifact@v4
        with:
          name: BasaProject-windows-${{ steps.ver.outputs.version }}-run${{ github.run_number }}
          path: dist/BasaProject
          retention-days: 30
          if-no-files-found: error

      - name: Upload installer
        if: hashFiles('Output/*.exe') != ''
        uses: actions/upload-artifact@v4
        with:
          name: BasaProject-setup-${{ steps.ver.outputs.version }}-run${{ github.run_number }}
          path: Output/*.exe
          retention-days: 30

      - name: Upload PyInstaller diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pyinstaller-diagnostics-run${{ github.run_number }}
          path: |
            build/**/*.txt
            build/**/*.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Publish update to Mail.ru cloud
        if: github.event_name == 'workflow_dispatch'
        env:
          MAILRU_USER: ${{ secrets.MAILRU_USER }}
          MAILRU_APP_PASSWORD: ${{ secrets.MAILRU_APP_PASSWORD }}
        shell: bash
        run: |
          python publish_update.py --win dist/BasaProject \
            --notes "Сборка run${{ github.run_number }}"    