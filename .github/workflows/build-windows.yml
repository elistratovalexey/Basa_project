name: Build Windows EXE
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt pyinstaller

      - name: Check build files exist
        shell: bash
        run: |
          for f in app.py requirements.txt basa.spec preflight_check.py; do
            if [ ! -f "$f" ]; then echo "MISSING FILE: $f"; exit 1; fi
            echo "OK: $f"
          done

      - name: Preflight
        run: python preflight_check.py

      - name: Build
        run: pyinstaller --noconfirm --clean basa.spec

       - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'

      - uses: actions/upload-artifact@v4
        with:
          name: BasaProject-setup
          path: Output/BasaProjectSetup-*.exe
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: BasaProject-windows
          path: dist/BasaProject
          retention-days: 30
