name: Generate signing key

on:
  workflow_dispatch:

jobs:
  genkey:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate keystore
        run: |
          PASS=$(openssl rand -hex 16)
          keytool -genkeypair -v \
            -keystore basa.keystore \
            -alias basa \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=BasaProject, O=Elistratov, C=RU"
          base64 -w 0 basa.keystore > keystore_base64.txt
          echo "KEYSTORE_PASSWORD = $PASS" > passwords.txt

      - name: Upload key
        uses: actions/upload-artifact@v4
        with:
          name: signing-key
          path: |
            keystore_base64.txt
            passwords.txt